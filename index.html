<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>VEXOHH Panel — Premium Social Media Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg-0:#0a0a0c;
    --bg-1:#111114;
    --card:#141418;
    --card-border:#2b2b33;
    --ink-0:#f4f4ee;
    --ink-1:#a8a8b2;
    --ink-2:#6b6b77;
    --accent:#c6ff3a;
    --accent-ink:#0a0a0c;
    --hot:#ff5a36;
    /* legacy names kept so inline styles / JS keep working */
    --pink:var(--accent);
    --purple:var(--accent);
    --red:#ff5a5a;
    --grad:var(--accent);
    --grad-soft:rgba(198,255,58,.07);
    --success:#c6ff3a;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-deep:5px 5px 0 0 rgba(198,255,58,.13);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    margin:0;
    background:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px) 0 0/34px 34px,
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px) 0 0/34px 34px,
      radial-gradient(620px 420px at 100% 0%, rgba(198,255,58,.10), transparent 62%),
      radial-gradient(500px 380px at 0% 100%, rgba(255,90,54,.07), transparent 60%),
      var(--bg-0);
    color:var(--ink-0);
    font-family:'Manrope',sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.display{ font-family:'Syne',sans-serif; letter-spacing:-0.02em; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  /* ---------- App shell ----------
     Each .screen is its own full-height page. Only the ACTIVE screen shows and
     only it scrolls internally — the body never scrolls. */
  #app{
    max-width:520px; margin:0 auto; position:relative;
    height:100vh; height:100dvh; overflow:hidden;
  }
  .screen{
    display:none;
    position:absolute; inset:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding-bottom:40px;
    animation: riseIn .35s cubic-bezier(.16,1,.3,1);
  }
  .screen.active{ display:block; }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:18px 20px 8px 20px;
  }
  .back-btn{
    width:40px;height:40px;border-radius:12px;
    background:var(--card); border:1.5px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-0); cursor:pointer; flex:0 0 auto;
    transition:transform .12s ease, border-color .2s ease;
  }
  .back-btn:hover{ border-color:var(--accent); }
  .back-btn:active{ transform:translate(2px,2px); }
  .brand-mini{ display:flex; align-items:center; gap:10px; }
  .brand-mini .mark{ width:30px;height:30px; }
  .brand-mini span{ font-family:'Syne',sans-serif; font-weight:800; font-size:17px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-0);}

  .mark{ position:relative; display:inline-block; }
  .mark svg{ display:block; width:100%; height:100%; }

  /* ================= LOADING SCREEN ================= */
  #screen-loading{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:22px; padding:24px;
  }
  .loader-mark{ width:104px;height:104px; position:relative; }
  .loader-ring{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0 30%, var(--accent) 100%);
    animation: spin 1.3s linear infinite;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
  }
  .loader-core{
    position:absolute; inset:13px; border-radius:50%;
    background:var(--bg-1);
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .welcome-kicker{ font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-1); margin:0; font-weight:600; }
  .welcome-title{ font-size:44px; font-weight:800; margin:0; letter-spacing:.04em; line-height:1; }
  .welcome-title em{ font-style:normal; color:var(--accent); }
  .welcome-sub{ color:var(--ink-1); font-size:14px; margin:0; letter-spacing:.04em; }
  .load-bar{ width:170px; height:4px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; }
  .load-bar-fill{ height:100%; width:0%; border-radius:99px; background:var(--accent); animation: fillbar 2s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes fillbar{ to{ width:100%; } }

  /* ================= GENERIC LAYOUT ================= */
  .stage{ padding:6px 20px 20px 20px; }
  .eyebrow{ font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 8px 0; }
  .heading{ font-size:30px; font-weight:800; margin:0 0 6px 0; line-height:1.1; }
  .subheading{ color:var(--ink-1); font-size:14.5px; margin:0 0 26px 0; line-height:1.5; }

  /* ---------- Card ---------- */
  .glass{
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:var(--radius-lg);
    box-shadow: var(--shadow-deep);
  }

  /* ---------- Inputs ---------- */
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12px; color:var(--ink-1); margin-bottom:8px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .field input{
    width:100%; padding:15px 16px; border-radius:var(--radius-sm);
    background:#0e0e11; border:1.5px solid var(--card-border);
    color:var(--ink-0); font-size:15px; font-family:'Manrope',sans-serif; font-weight:500;
    outline:none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color:var(--ink-2); }
  .field input:focus{ border-color:var(--accent); box-shadow:3px 3px 0 rgba(198,255,58,.25); }
  .error-text{ color:var(--red); font-size:12.5px; margin-top:8px; display:none; font-weight:600; }
  .error-text.show{ display:block; }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none; border:none; cursor:pointer;
    width:100%; padding:16px 20px; border-radius:var(--radius-sm);
    font-family:'Syne',sans-serif; font-size:15.5px; font-weight:700; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
  }
  .btn-primary{
    background:var(--accent); color:var(--accent-ink);
    box-shadow: 4px 4px 0 0 rgba(255,255,255,.88);
  }
  .btn-primary svg{ stroke:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-primary:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 0 rgba(255,255,255,.88); }
  .btn-ghost{
    background:transparent; color:var(--ink-0); border:1.5px solid var(--card-border);
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-ghost:active{ transform:translate(2px,2px); }
  .btn-whatsapp{
    background:#25D366; color:#04210f;
    box-shadow: 4px 4px 0 0 rgba(255,255,255,.88);
  }
  .btn-whatsapp:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 0 rgba(255,255,255,.88); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ---------- Service cards (main categories) ---------- */
  .card-list{ display:flex; flex-direction:column; gap:14px; }
  .service-card{
    padding:18px; border-radius:var(--radius-lg);
    display:flex; align-items:center; gap:16px;
    cursor:pointer; text-align:left;
    transition: transform .14s ease, border-color .2s ease, box-shadow .14s ease;
    position:relative; overflow:hidden;
  }
  .service-card::before{
    content:''; position:absolute; inset:0; opacity:0;
    background:var(--grad-soft); transition:opacity .2s ease;
  }
  .service-card:hover::before, .service-card:active::before{ opacity:1; }
  .service-card:hover{ transform:translate(-2px,-2px); border-color:var(--accent); box-shadow:7px 7px 0 0 rgba(198,255,58,.2); }
  .service-card:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 0 rgba(198,255,58,.2); }
  .service-icon{
    width:52px; height:52px; border-radius:14px; flex:0 0 auto;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    position:relative; z-index:1;
  }
  .service-icon svg{ width:26px; height:26px; stroke:var(--accent-ink); }
  .service-icon svg [fill="#fff"]{ fill:var(--accent-ink); }
  .service-text{ position:relative; z-index:1; }
  .service-text h3{ margin:0 0 3px 0; font-size:17px; font-weight:700; }
  .service-text p{ margin:0; font-size:13px; color:var(--ink-1); }
  .chev{ margin-left:auto; color:var(--ink-2); position:relative; z-index:1; flex:0 0 auto; }

  /* Special offer card — inverted so it stands out from the rest */
  .offer-card{
    background:var(--accent); border-color:var(--accent);
    box-shadow:5px 5px 0 0 rgba(255,255,255,.85);
    overflow:visible;
  }
  .offer-card::before{ display:none; }
  .offer-card:hover{ border-color:var(--accent); box-shadow:7px 7px 0 0 rgba(255,255,255,.9); }
  .offer-card:active{ box-shadow:2px 2px 0 0 rgba(255,255,255,.9); }
  .offer-card .service-icon{ background:var(--accent-ink); }
  .offer-card .service-icon svg{ stroke:var(--accent); }
  .offer-card .service-icon svg [fill="#fff"]{ fill:var(--accent); }
  .offer-card .service-text h3{ color:var(--accent-ink); }
  .offer-card .service-text p{ color:rgba(10,10,12,.72); font-weight:600; }
  .offer-card .chev{ color:var(--accent-ink); }
  .offer-badge{
    position:absolute; top:-11px; right:16px; z-index:2;
    background:var(--hot); color:#fff; font-family:'Syne',sans-serif;
    font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    padding:4px 10px; border-radius:6px; transform:rotate(2deg);
  }

  /* ---------- Group list (services with rates) ---------- */
  .group-title{
    font-family:'Syne',sans-serif;
    font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800;
    color:var(--accent); margin:26px 0 12px 0;
    display:flex; align-items:center; gap:10px;
  }
  .group-title::before{ content:''; width:20px; height:3px; background:var(--accent); border-radius:2px; flex:0 0 auto; }
  .group-title:first-child{ margin-top:4px; }
  .rate-item{
    padding:15px 16px; border-radius:var(--radius-md);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    cursor:pointer; margin-bottom:10px;
    transition: transform .12s ease, border-color .2s ease, box-shadow .12s ease;
  }
  .rate-item:hover{ border-color:var(--accent); transform:translate(-2px,-2px); box-shadow:6px 6px 0 0 rgba(198,255,58,.18); }
  .rate-item:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 0 rgba(198,255,58,.18); }
  .rate-item .ri-name{ font-size:14.5px; font-weight:600; color:var(--ink-0); line-height:1.35; }
  .rate-item .ri-rate{
    font-family:'Syne',sans-serif; font-weight:800; font-size:13.5px;
    color:var(--accent-ink); background:var(--accent);
    padding:6px 10px; border-radius:8px;
    white-space:nowrap; flex:0 0 auto;
  }

  /* ---------- Order details ---------- */
  .selected-banner{
    padding:16px 18px; border-radius:var(--radius-md); margin-bottom:22px;
    background:var(--card); border:1.5px solid var(--card-border); border-left:5px solid var(--accent);
  }
  .selected-banner .sb-label{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-1); margin-bottom:4px; font-weight:700;}
  .selected-banner .sb-name{ font-size:16px; font-weight:800; font-family:'Syne',sans-serif; line-height:1.3; }
  .selected-banner .sb-rate{ font-size:13px; color:var(--accent); margin-top:4px; font-weight:700; }
  .total-box{
    padding:20px; border-radius:var(--radius-md); text-align:center; margin:22px 0;
    background:rgba(198,255,58,.05);
    border:2px dashed rgba(198,255,58,.55);
  }
  .total-box .tb-label{ font-size:12px; color:var(--ink-1); text-transform:uppercase; letter-spacing:.16em; margin-bottom:6px; font-weight:700;}
  .total-box .tb-amount{ font-size:38px; font-weight:800; font-family:'Syne',sans-serif; color:var(--accent); }
  .warn-box{
    display:flex; gap:12px; align-items:flex-start;
    padding:16px 18px; border-radius:var(--radius-md); margin-bottom:22px;
    background:rgba(255,90,90,.08); border:1.5px solid rgba(255,90,90,.4);
  }
  .warn-box svg{ flex:0 0 auto; margin-top:1px; }
  .warn-box .w-title{ font-weight:800; font-size:14.5px; margin-bottom:3px; }
  .warn-box .w-sub{ font-size:12.5px; color:var(--ink-1); line-height:1.5; }

  /* ---------- Payment screen ---------- */
  .qr-wrap{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:26px 20px; border-radius:var(--radius-lg); margin-bottom:22px;
  }
  .qr-frame{
    padding:14px; background:#fff; border-radius:14px;
    box-shadow: 6px 6px 0 0 var(--accent);
  }
  #qrcode{ width:200px; height:200px; }
  .upi-row{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-1); }
  .upi-row b{ color:var(--ink-0); font-family:'Syne',sans-serif; letter-spacing:.02em; }
  .copy-btn{
    border:1.5px solid var(--card-border); background:transparent; color:var(--ink-0);
    padding:6px 10px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .pay-amount{ font-size:34px; font-weight:800; font-family:'Syne',sans-serif; color:var(--accent); }

  /* ---------- Success screen ---------- */
  .success-mark{
    width:76px; height:76px; border-radius:50%; margin:0 auto 20px auto;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 5px 5px 0 0 rgba(255,255,255,.85);
  }
  .summary-row{
    display:flex; justify-content:space-between; gap:14px;
    padding:13px 0; border-bottom:1px dashed rgba(255,255,255,.12);
    font-size:13.5px;
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .sr-k{ color:var(--ink-1); flex:0 0 40%; }
  .summary-row .sr-v{ color:var(--ink-0); font-weight:700; text-align:right; word-break:break-word; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:#1b1b20; border:1.5px solid var(--accent); color:var(--ink-0);
    padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:999;
    opacity:0; transition: opacity .25s ease, transform .25s ease; pointer-events:none;
    box-shadow:4px 4px 0 0 rgba(198,255,58,.25);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .not-available{ text-align:center; padding:60px 20px; color:var(--ink-1); }

  /* ---------- Cart items ---------- */
  .cart-item{
    padding:16px 18px; border-radius:var(--radius-md); margin-bottom:12px;
    display:flex; align-items:flex-start; gap:12px;
  }
  .cart-item .ci-body{ flex:1 1 auto; min-width:0; }
  .cart-item .ci-name{ font-size:14.5px; font-weight:800; margin-bottom:3px; font-family:'Syne',sans-serif; }
  .cart-item .ci-meta{ font-size:12px; color:var(--ink-1); line-height:1.5; word-break:break-word; }
  .cart-item .ci-amount{ font-family:'Syne',sans-serif; font-weight:800; font-size:15px; color:var(--accent); white-space:nowrap; margin-top:6px; }
  .cart-item .ci-remove{
    width:30px; height:30px; border-radius:8px; flex:0 0 auto;
    background:rgba(255,90,90,.1); border:1.5px solid rgba(255,90,90,.4); color:var(--red);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .cart-empty{ text-align:center; padding:36px 16px; color:var(--ink-1); font-size:14px; }


  /* ---------- Dashboard ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:4px; }
  .stat-tile{ padding:14px 6px; text-align:center; }
  .stat-num{ font-family:'Syne',sans-serif; font-weight:800; font-size:24px; color:var(--accent); line-height:1; }
  .stat-label{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-1); margin-top:7px; font-weight:700; }
  .cat-meta{ display:block; margin-top:6px; font-size:11.5px; font-weight:700; color:var(--accent); }
  .offer-card .cat-meta{ color:var(--accent-ink); }
  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .about-tile{ padding:14px; border-radius:var(--radius-md); }
  .about-ico{
    width:34px; height:34px; border-radius:10px; margin-bottom:10px;
    background:rgba(198,255,58,.12); display:flex; align-items:center; justify-content:center;
  }
  .about-ico svg{ width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .about-tile h4{ margin:0 0 4px 0; font-family:'Syne',sans-serif; font-size:13.5px; font-weight:800; }
  .about-tile p{ margin:0; font-size:12px; color:var(--ink-1); line-height:1.45; }

  ::selection{ background:rgba(198,255,58,.4); color:#000; }

  /* ---------- WhatsApp support button (fixed, always visible) ---------- */
  .support-fab{
    position:fixed; top:16px; right:16px; z-index:500;
    display:flex; align-items:center; gap:7px;
    padding:9px 14px 9px 10px; border-radius:10px;
    background:#25D366; color:#04210f;
    text-decoration:none; font-family:'Syne',sans-serif; font-weight:800; font-size:12.5px;
    box-shadow:3px 3px 0 0 rgba(255,255,255,.85);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .support-fab svg{ fill:#04210f; }
  .support-fab:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 0 rgba(255,255,255,.85); }
  @media (max-width:380px){
    .support-fab span{ display:none; }
    .support-fab{ padding:9px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= 1. LOADING SCREEN ================= -->
  <div class="screen active" id="screen-loading">
    <div class="loader-mark">
      <div class="loader-ring"></div>
      <div class="loader-core">
        <div class="mark" style="width:40px;height:40px;"><svg viewBox="0 0 48 48" fill="none"><path d="M5 9h12l7 19 7-19h12L30 41h-12z" fill="#c6ff3a"/></svg></div>
      </div>
    </div>
    <p class="welcome-kicker">Welcome to</p>
    <h1 class="welcome-title">VEXOHH<em>.</em></h1>
    <p class="welcome-sub">Premium Social Media Services</p>
    <div class="load-bar"><div class="load-bar-fill"></div></div>
  </div>

  <!-- ================= 3. MAIN SERVICE CATEGORIES ================= -->
  <div class="screen" id="screen-main">
    <div class="topbar">
      <div class="brand-mini">
        <div class="mark"><svg viewBox="0 0 48 48" fill="none"><path d="M5 9h12l7 19 7-19h12L30 41h-12z" fill="#c6ff3a"/></svg></div>
        <span>VEXOHH</span>
      </div>
    </div>
    <div class="stage" style="padding-top:16px;">
      <p class="eyebrow">VEXOHH Panel</p>
      <h2 class="heading">Dashboard</h2>
      <p class="subheading">Pick a category to place your order.</p>

      <div class="stat-row">
        <div class="stat-tile glass"><div class="stat-num" id="stat-services">–</div><div class="stat-label">Services</div></div>
        <div class="stat-tile glass"><div class="stat-num" id="stat-categories">–</div><div class="stat-label">Categories</div></div>
        <div class="stat-tile glass"><div class="stat-num" id="stat-discount">–</d
